services:
  nginx:
    image: nginx:alpine
    container_name: practice23_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - app-network

  backend1:
    build: .
    container_name: practice23_backend1
    command: node server1.js
    expose:
      - "3000"
    networks:
      - app-network

  backend2:
    build: .
    container_name: practice23_backend2
    command: node server2.js
    expose:
      - "3000"
    networks:
      - app-network

  backend3:
    build: .
    container_name: practice23_backend3
    command: node server3.js
    expose:
      - "3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge